name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # No reverse-geocoding calls to OpenStreetMap from CI
      PHOTO_PLACES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx jest --ci
