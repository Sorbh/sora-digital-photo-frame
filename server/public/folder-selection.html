<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d6336a">
    <title>Choose folder · Sora Frame</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.1/dist/basecoat.cdn.min.css">
    <link rel="stylesheet" href="/css/sora.css">

    <!-- Theme: follow the admin's saved choice (system / dark / light) -->
    <script>
    (() => {
      try {
        const stored = localStorage.getItem('themeMode');
        const dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        .main-content {
            padding: 0 clamp(1rem, 3vw, 2.5rem) 4rem;
        }

        .browser-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0 0 1rem;
        }

        .browser-title {
            margin: 0;
            font-family: var(--font-display);
            font-variation-settings: 'SOFT' 100;
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .browser-subtitle {
            margin: 0;
            color: var(--muted-foreground);
            font-size: 0.9375rem;
        }

        .notification {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: var(--shape-sm);
            background: var(--ink);
            color: var(--paper);
            font-weight: 600;
            box-shadow: var(--shadow-lift);
            transform: translate(-50%, 0);
            animation: note-in 0.35s var(--ease-out) both;
        }

        .notification .material-symbols-outlined {
            color: var(--berry);
            font-variation-settings: 'FILL' 1;
        }

        .notification.leaving {
            animation: note-out 0.3s ease both;
        }

        @keyframes note-in {
            from { opacity: 0; transform: translate(-50%, 12px); }
        }

        @keyframes note-out {
            to { opacity: 0; transform: translate(-50%, 12px); }
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 0 0.75rem 2rem;
            }

            .notification {
                bottom: calc(96px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <a href="/slideshow" class="sora-wordmark" aria-label="Back to the slideshow">Sora</a>
            <span class="topbar-divider"></span>
            <span class="sora-eyebrow">Now playing</span>
        </div>
        <div class="topbar-actions">
            <a href="/admin" class="tb-btn tb-desktop" title="Manage the library">
                <span class="material-symbols-outlined">photo_library</span>
                <span class="tb-label">Library</span>
            </a>
        </div>
    </header>

    <section class="library-head">
        <div class="library-title">
            <div class="crumb-row">
                <button class="back-btn" onclick="goBack()" title="Back" aria-label="Back">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <p class="sora-eyebrow" style="margin: 0;">Slideshow source</p>
            </div>
            <h1 class="page-title sora-display no-transform">What should <em>play?</em></h1>
            <p class="page-meta">
                <span class="material-symbols-outlined" style="font-size:16px;font-variation-settings:'FILL' 1">favorite</span>
                <span id="currentSelection">All folders</span>
            </p>
        </div>
        <div class="library-actions">
            <a href="/slideshow" class="btn mobile-hide">
                <span class="material-symbols-outlined">play_arrow</span>
                Start slideshow
            </a>
        </div>
    </section>

    <main class="main-content">
        <div class="browser-head">
            <h2 class="browser-title">Choose a folder</h2>
            <p class="browser-subtitle">Only photos from the chosen folder will play.</p>
        </div>

        <div id="folderBrowser">
            <!-- Folder browser will be initialized here -->
        </div>
    </main>

    <!-- Mobile tab bar -->
    <nav class="tabbar" aria-label="Sections">
        <a href="/admin" class="tab">
            <span class="material-symbols-outlined">photo_library</span><span>Library</span>
        </a>
        <a href="/access-accounts" class="tab">
            <span class="material-symbols-outlined">key</span><span>Access</span>
        </a>
        <a href="/slideshow" class="tab-fab" aria-label="Start slideshow">
            <span class="material-symbols-outlined">play_arrow</span>
        </a>
        <a href="/folder-selection" class="tab active" aria-current="page">
            <span class="material-symbols-outlined">folder_special</span><span>Folders</span>
        </a>
        <a href="/slideshow" class="tab">
            <span class="material-symbols-outlined">slideshow</span><span>Slideshow</span>
        </a>
    </nav>

    <!-- Load required scripts -->
    <script src="/js/folderService.js"></script>
    <script src="/js/folderStorage.js"></script>
    <script src="/js/folderBrowser.js"></script>

    <script>
        let folderBrowser;
        
        // Initialize folder browser when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initializeFolderBrowser();
            updateCurrentSelection();
        });

        function initializeFolderBrowser() {
            const container = document.getElementById('folderBrowser');
            
            folderBrowser = new FolderBrowser(container, {
                showBreadcrumb: true,
                showAllFoldersOption: true,
                onFolderSelected: onFolderSelected,
                onFolderChanged: onFolderChanged
            });
        }

        function onFolderSelected(folderPath, folderName) {
            console.log('Folder selected:', folderPath, folderName);
            updateCurrentSelection();
            
            // Show success feedback
            showNotification(`Now playing ${folderName}`);
        }

        function onFolderChanged(folderPath, folderName) {
            console.log('Folder changed:', folderPath, folderName);
            updateCurrentSelection();
        }

        function updateCurrentSelection() {
            const storage = new FolderStorage();
            const selection = storage.loadSelectedFolder();
            const selectionElement = document.getElementById('currentSelection');
            
            if (selection) {
                selectionElement.textContent = `Playing ${selection.name}`;
            } else {
                selectionElement.textContent = 'Playing all folders';
            }
        }

        function goBack() {
            // Check if there's a referrer, otherwise go to slideshow
            if (document.referrer && document.referrer !== window.location.href) {
                window.history.back();
            } else {
                window.location.href = '/slideshow';
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.setAttribute('role', 'status');
            notification.innerHTML = '<span class="material-symbols-outlined">favorite</span><span></span>';
            notification.lastChild.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('leaving');
                setTimeout(() => notification.remove(), 300);
            }, 2600);
        }

        // Handle browser navigation
        window.addEventListener('popstate', () => {
            goBack();
        });
    </script>
</body>
</html>
