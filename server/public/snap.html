<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d6336a">
    <title data-i18n="snap.static_001">Snap · Sora Frame</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.1/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.1/dist/js/all.min.js" defer></script>
    <link rel="stylesheet" href="/css/sora.css">
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- Theme: follow the admin's saved choice (system / dark / light) -->
    <script>
    (() => {
      try {
        const stored = localStorage.getItem('themeMode');
        const dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    })();
    </script>
    <link rel="stylesheet" href="/css/access-accounts.css">
    <link rel="stylesheet" href="/css/notePage.css">
    <link rel="stylesheet" href="/css/notes.css">
    <link rel="stylesheet" href="/css/i18n.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-brand">
                <a href="/admin" class="sora-wordmark" aria-label="Sora library home" data-i18n-attr="aria-label:snap.static_007">Sora</a>
                <span class="topbar-divider"></span>
                <span class="sora-eyebrow" data-i18n="snap.eyebrow">Snap</span>
            </div>
            <div class="topbar-actions">
                <a href="/admin" class="tb-btn tb-desktop" title="Back to the library" data-i18n-attr="title:snap.static_008">
                    <span class="material-symbols-outlined">photo_library</span>
                    <span class="tb-label" data-i18n="common.library">Library</span>
                </a>
                <a href="/notes" class="tb-btn tb-desktop" title="Notes for the frame" data-i18n-attr="title:snap.static_009">
                    <span class="material-symbols-outlined">edit_note</span>
                    <span class="tb-label" data-i18n="common.notes">Notes</span>
                </a>
                <a href="/slideshow" class="tb-btn tb-desktop" title="Open the slideshow" data-i18n-attr="title:snap.static_010">
                    <span class="material-symbols-outlined">slideshow</span>
                    <span class="tb-label" data-i18n="common.slideshow">Slideshow</span>
                </a>
            </div>
        </header>

        <section class="library-head">
            <div class="library-title">
                <div class="crumb-row">
                    <a href="/admin" id="backLink" class="back-btn" title="Back to the folder" aria-label="Back to the folder" data-i18n-attr="title:snap.static_011; aria-label:snap.static_012">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <p class="sora-eyebrow" style="margin: 0;" id="snapFolder"></p>
                </div>
                <h1 class="page-title sora-display no-transform" id="snapHeading"></h1>
                <p class="page-meta sora-mono"><span class="material-symbols-outlined" style="font-size:16px">auto_stories</span><span data-i18n="snap.static_002">A memory-book page that plays with the photos in this folder</span></p>
            </div>
        </section>

        <main class="main-content">
            <div class="snap-sheet">
                <section class="note-editor">
                    <form id="noteForm" class="note-form" novalidate>
                        <label class="nf-field">
                            <span class="nf-label"><span data-i18n="notes.labelHeadline">Headline</span> <span class="nf-count" data-count-for="title"></span></span>
                            <input class="input" type="text" name="title" maxlength="60" required placeholder="Our week in Goa" data-i18n-attr="placeholder:snap.static_013" autocomplete="off">
                            <span class="nf-error" data-error-for="title"></span>
                        </label>

                        <label class="nf-field">
                            <span class="nf-label"><span data-i18n="notes.labelMessage">Message</span> <span class="nf-count" data-count-for="message"></span></span>
                            <textarea class="textarea" name="message" maxlength="160" rows="2" placeholder="Sandcastles, mango ice cream and far too much sun." data-i18n-attr="placeholder:snap.static_014"></textarea>
                            <span class="nf-error" data-error-for="message"></span>
                        </label>

                        <label class="nf-field">
                            <span class="nf-label" data-i18n="snap.static_003">Sign-off</span>
                            <input class="input" type="text" name="signoff" maxlength="40" placeholder="Love, Ambika" data-i18n-attr="placeholder:snap.static_015" autocomplete="off">
                        </label>

                        <div class="nf-field">
                            <span class="nf-label"><span data-i18n="notes.labelPhotos">Photos</span> <span class="nf-hint" data-i18n="snap.static_004">up to 4</span></span>
                            <div class="nf-photos" id="photoTiles"></div>
                            <span class="nf-error" data-error-for="photos"></span>
                        </div>

                        <div class="nf-field">
                            <span class="nf-label"><span data-i18n="snap.static_016">Layout</span> <span class="nf-hint" id="layoutHint"></span></span>
                            <div class="nf-layouts" id="layoutPicker" role="radiogroup" aria-label="Layout" data-i18n-attr="aria-label:snap.static_016"></div>
                            <span class="nf-error" data-error-for="layout"></span>
                        </div>

                        <label class="nf-field">
                            <span class="nf-label"><span data-i18n="notes.static_011">Date line</span> <span class="nf-hint" data-i18n="notes.optional">optional</span></span>
                            <input class="input" type="text" name="eyebrow" maxlength="40" placeholder="Summer 2024" data-i18n-attr="placeholder:snap.static_017" autocomplete="off">
                        </label>

                        <div class="nf-row nf-inline">
                            <span class="nf-label" data-i18n="snap.static_018">Theme</span>
                            <div class="nf-swatches" role="radiogroup" aria-label="Theme" data-i18n-attr="aria-label:snap.static_018">
                                <label class="swatch swatch-paper" title="Paper" data-i18n-attr="title:snap.static_019"><input type="radio" name="theme" value="paper" checked><span></span></label>
                                <label class="swatch swatch-berry" title="Berry" data-i18n-attr="title:snap.static_020"><input type="radio" name="theme" value="berry"><span></span></label>
                                <label class="swatch swatch-ink" title="Ink" data-i18n-attr="title:snap.static_021"><input type="radio" name="theme" value="ink"><span></span></label>
                            </div>
                        </div>

                    </form>

                    <aside class="note-preview-pane">
                        <span class="nf-label" data-i18n="notes.labelPreview">Preview</span>
                        <div class="note-stage note-preview" id="notePreview"></div>
                        <div class="preview-orient" role="group" aria-label="Preview shape" data-i18n-attr="aria-label:snap.static_022">
                            <button type="button" class="active" data-orient="landscape" title="Landscape screen" data-i18n-attr="title:snap.static_023"><span class="material-symbols-outlined">crop_landscape</span></button>
                            <button type="button" data-orient="portrait" title="Portrait screen" data-i18n-attr="title:snap.static_024"><span class="material-symbols-outlined">crop_portrait</span></button>
                        </div>
                    </aside>
                </section>
                <footer class="snap-actions">
                    <a href="/admin" id="cancelSnapBtn" class="btn-outline" data-i18n="common.cancel">Cancel</a>
                    <button type="submit" id="saveSnapBtn" class="btn" form="noteForm">
                        <span class="material-symbols-outlined">check</span>
                        <span data-i18n="snap.saveSnap">Save snap</span>
                    </button>
                </footer>
            </div>
        </main>

        <!-- Photo picker -->
        <dialog id="photoPicker" class="dialog photo-picker" aria-labelledby="photoPickerTitle">
            <article>
                <header>
                    <h2 id="photoPickerTitle" data-i18n="snap.static_005">Choose photos</h2>
                    <nav class="picker-crumbs" id="pickerCrumbs" aria-label="Folder" data-i18n-attr="aria-label:snap.static_025"></nav>
                </header>
                <section>
                    <div class="picker-grid" id="pickerGrid"></div>
                </section>
                <footer>
                    <span class="picker-count" id="pickerCount"></span>
                    <button type="button" id="pickerCancel" class="btn-outline" data-i18n="common.cancel">Cancel</button>
                    <button type="button" id="pickerDone" class="btn" data-i18n="snap.static_006">Use photos</button>
                </footer>
            </article>
        </dialog>

        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/notePage.js"></script>
    <script src="/js/pageEditor.js"></script>
    <script src="/js/snap.js"></script>
</body>

</html>
