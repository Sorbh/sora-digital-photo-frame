<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d6336a">
    <title>Snap · Sora Frame</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.1/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.1/dist/js/all.min.js" defer></script>
    <link rel="stylesheet" href="/css/sora.css">
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- Theme: follow the admin's saved choice (system / dark / light) -->
    <script>
    (() => {
      try {
        const stored = localStorage.getItem('themeMode');
        const dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    })();
    </script>
    <link rel="stylesheet" href="/css/access-accounts.css">
    <link rel="stylesheet" href="/css/notePage.css">
    <link rel="stylesheet" href="/css/notes.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-brand">
                <a href="/admin" class="sora-wordmark" aria-label="Sora library home">Sora</a>
                <span class="topbar-divider"></span>
                <span class="sora-eyebrow">Snap</span>
            </div>
            <div class="topbar-actions">
                <a href="/admin" class="tb-btn tb-desktop" title="Back to the library">
                    <span class="material-symbols-outlined">photo_library</span>
                    <span class="tb-label">Library</span>
                </a>
                <a href="/notes" class="tb-btn tb-desktop" title="Notes for the frame">
                    <span class="material-symbols-outlined">edit_note</span>
                    <span class="tb-label">Notes</span>
                </a>
                <a href="/slideshow" class="tb-btn tb-desktop" title="Open the slideshow">
                    <span class="material-symbols-outlined">slideshow</span>
                    <span class="tb-label">Slideshow</span>
                </a>
            </div>
        </header>

        <section class="library-head">
            <div class="library-title">
                <div class="crumb-row">
                    <a href="/admin" id="backLink" class="back-btn" title="Back to the folder" aria-label="Back to the folder">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <p class="sora-eyebrow" style="margin: 0;" id="snapFolder">Library</p>
                </div>
                <h1 class="page-title sora-display no-transform" id="snapHeading">New <em>snap</em></h1>
                <p class="page-meta sora-mono"><span class="material-symbols-outlined" style="font-size:16px">auto_stories</span><span>A memory-book page that plays with the photos in this folder</span></p>
            </div>
        </section>

        <main class="main-content">
            <div class="snap-sheet">
                <section class="note-editor">
                    <form id="noteForm" class="note-form" novalidate>
                        <label class="nf-field">
                            <span class="nf-label">Headline <span class="nf-count" data-count-for="title"></span></span>
                            <input class="input" type="text" name="title" maxlength="60" required placeholder="Our week in Goa" autocomplete="off">
                            <span class="nf-error" data-error-for="title"></span>
                        </label>

                        <label class="nf-field">
                            <span class="nf-label">Message <span class="nf-count" data-count-for="message"></span></span>
                            <textarea class="textarea" name="message" maxlength="160" rows="2" placeholder="Sandcastles, mango ice cream and far too much sun."></textarea>
                            <span class="nf-error" data-error-for="message"></span>
                        </label>

                        <label class="nf-field">
                            <span class="nf-label">Sign-off</span>
                            <input class="input" type="text" name="signoff" maxlength="40" placeholder="Love, Ambika" autocomplete="off">
                        </label>

                        <div class="nf-field">
                            <span class="nf-label">Photos <span class="nf-hint">up to 4</span></span>
                            <div class="nf-photos" id="photoTiles"></div>
                            <span class="nf-error" data-error-for="photos"></span>
                        </div>

                        <div class="nf-field">
                            <span class="nf-label">Layout <span class="nf-hint" id="layoutHint"></span></span>
                            <div class="nf-layouts" id="layoutPicker" role="radiogroup" aria-label="Layout"></div>
                            <span class="nf-error" data-error-for="layout"></span>
                        </div>

                        <label class="nf-field">
                            <span class="nf-label">Date line <span class="nf-hint">optional</span></span>
                            <input class="input" type="text" name="eyebrow" maxlength="40" placeholder="Summer 2024" autocomplete="off">
                        </label>

                        <div class="nf-row nf-inline">
                            <span class="nf-label">Theme</span>
                            <div class="nf-swatches" role="radiogroup" aria-label="Theme">
                                <label class="swatch swatch-paper" title="Paper"><input type="radio" name="theme" value="paper" checked><span></span></label>
                                <label class="swatch swatch-berry" title="Berry"><input type="radio" name="theme" value="berry"><span></span></label>
                                <label class="swatch swatch-ink" title="Ink"><input type="radio" name="theme" value="ink"><span></span></label>
                            </div>
                        </div>

                    </form>

                    <aside class="note-preview-pane">
                        <span class="nf-label">Preview</span>
                        <div class="note-stage note-preview" id="notePreview"></div>
                        <div class="preview-orient" role="group" aria-label="Preview shape">
                            <button type="button" class="active" data-orient="landscape" title="Landscape screen"><span class="material-symbols-outlined">crop_landscape</span></button>
                            <button type="button" data-orient="portrait" title="Portrait screen"><span class="material-symbols-outlined">crop_portrait</span></button>
                        </div>
                    </aside>
                </section>
                <footer class="snap-actions">
                    <a href="/admin" id="cancelSnapBtn" class="btn-outline">Cancel</a>
                    <button type="submit" id="saveSnapBtn" class="btn" form="noteForm">
                        <span class="material-symbols-outlined">check</span>
                        Save snap
                    </button>
                </footer>
            </div>
        </main>

        <!-- Photo picker -->
        <dialog id="photoPicker" class="dialog photo-picker" aria-labelledby="photoPickerTitle">
            <article>
                <header>
                    <h2 id="photoPickerTitle">Choose photos</h2>
                    <nav class="picker-crumbs" id="pickerCrumbs" aria-label="Folder"></nav>
                </header>
                <section>
                    <div class="picker-grid" id="pickerGrid"></div>
                </section>
                <footer>
                    <span class="picker-count" id="pickerCount"></span>
                    <button type="button" id="pickerCancel" class="btn-outline">Cancel</button>
                    <button type="button" id="pickerDone" class="btn">Use photos</button>
                </footer>
            </article>
        </dialog>

        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="/js/notePage.js"></script>
    <script src="/js/pageEditor.js"></script>
    <script src="/js/snap.js"></script>
</body>

</html>
